# Immutable dated evidence and third-party research snapshots are not maintained code.
# Native probes and experiment/verification drivers are test code. The app adapter,
# launchers, provisioning, provenance, resource monitor and engine selection stay sources.
sonar.sources=.
sonar.tests=macos/lab/tests,macos/lab/native,macos/lab/scripts
sonar.exclusions=macos/lab/bench/**,macos/lab/tests/**,macos/lab/native/**,macos/lab/scripts/benchmark_*.py,macos/lab/scripts/profile_*.py,macos/lab/scripts/verify_*.py,macos/lab/scripts/context_fixture.py,macos/lab/scripts/validate_offline.py
sonar.test.inclusions=macos/lab/tests/**,macos/lab/native/**,macos/lab/scripts/benchmark_*.py,macos/lab/scripts/profile_*.py,macos/lab/scripts/verify_*.py,macos/lab/scripts/context_fixture.py,macos/lab/scripts/validate_offline.py
sonar.python.version=3.12
sonar.cfamily.reportingCppStandardOverride=c++17
