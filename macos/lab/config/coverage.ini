[run]
branch = True
relative_files = True
data_file = bench/features/coverage/.coverage
# check_coverage --scope reads the maintained Mac manifest. An unset scope traces
# nothing, and the separate gate rejects missing/unbound evidence.
include = ${MAC_QUALITY_COVERAGE_SCOPE-__unbound_coverage_scope__}
context = ${MAC_QUALITY_COVERAGE_CONTEXT-unbound}

[report]
precision = 2
# Count uncovered paths rather than introducing coverage exclusions.
exclude_lines =

[json]
output = bench/features/coverage/coverage.json
pretty_print = True
