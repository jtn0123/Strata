[mypy]
python_version = 3.12
files =
    $MYPY_CONFIG_FILE_DIR/../scripts/native_backend.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/run.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/stop.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/runtime_profiles.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/performance_metrics.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/model_provenance.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/benchmark_signals.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/metal_environment.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/lab.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/engines.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/runtime_memory.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/check_memory.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/benchmark_metrics.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/strata_server.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/memory_monitor.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/benchmark.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/benchmark_cache.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/trial_workloads.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/check_quality.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/check_coverage.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/wait_telemetry.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/web_ui.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/api_requests.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/trial_support.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/benchmark_editing.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/benchmark_prompt_chunks.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/verify_runtime_profiles.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/prompt_ops.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/profile_prompt_ops.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/segment_ops.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/overlap_ops.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/advise_ops.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/profile_advise.py
mypy_path =
    $MYPY_CONFIG_FILE_DIR/../scripts,
    $MYPY_CONFIG_FILE_DIR/../vendor/Strata-macOS,
    $MYPY_CONFIG_FILE_DIR/../vendor/llama.cpp/gguf-py
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
strict_bytes = True
show_error_codes = True
# Retain inferred types from local dependencies without claiming those older
# experiment/build helpers are part of this maintained-runtime gate.
follow_imports = silent

# The revision-pinned API shell and GGUF parser are external runtime boundaries.
# Their public objects enter through documented adapters; vendor sources remain
# unchanged and are verified separately by source receipts and integration tests.
[mypy-serve,serve.*]
follow_imports = skip

[mypy-gguf,gguf.*]
follow_imports = skip

[mypy-benchmark_signals,metal_environment,runtime_profiles,model_provenance,lab,engines,runtime_memory,check_memory,benchmark_metrics,strata_server,check_quality,memory_monitor,check_coverage,wait_telemetry,api_requests,prompt_ops,segment_ops,overlap_ops,advise_ops]
# Set strict flags individually: mypy's "strict" preset applies globally even
# when written in a module section, which would misstate the staged coverage.
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
implicit_reexport = False
strict_equality = True
extra_checks = True
