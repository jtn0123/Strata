[mypy]
python_version = 3.12
files =
    $MYPY_CONFIG_FILE_DIR/../scripts/native_backend.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/run.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/stop.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/runtime_profiles.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/performance_metrics.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/model_provenance.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/benchmark_signals.py,
    $MYPY_CONFIG_FILE_DIR/../scripts/metal_environment.py
mypy_path =
    $MYPY_CONFIG_FILE_DIR/../scripts,
    $MYPY_CONFIG_FILE_DIR/../vendor/Strata-macOS,
    $MYPY_CONFIG_FILE_DIR/../vendor/llama.cpp/gguf-py
check_untyped_defs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_return_any = True
warn_unused_ignores = True
warn_redundant_casts = True
strict_bytes = True
show_error_codes = True
# Retain inferred types from local dependencies without claiming those older
# experiment/build helpers are part of this maintained-runtime gate.
follow_imports = silent

# The revision-pinned API shell and GGUF parser are external runtime boundaries.
# Their public objects enter through documented adapters; vendor sources remain
# unchanged and are verified separately by source receipts and integration tests.
[mypy-serve,serve.*]
follow_imports = skip

[mypy-gguf,gguf.*]
follow_imports = skip

[mypy-benchmark_signals,metal_environment]
# Set strict flags individually: mypy's "strict" preset applies globally even
# when written in a module section, which would misstate the staged coverage.
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
implicit_reexport = False
strict_equality = True
extra_checks = True
