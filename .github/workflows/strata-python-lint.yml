name: Strata Python checks

# The server, setup and tools (everything outside macos/, which has its own, fuller checks in mac-lab-offline.yml):
# syntax errors and undefined names, the checks that fail at run time.
on:
  pull_request:
    branches: [mac-m5-lab]
    paths:
      - '**.py'
      - '!macos/**'
      - '.github/requirements-lint.lock'
      - '.github/workflows/strata-python-lint.yml'
  push:
    branches: [mac-m5-lab]
    paths:
      - '**.py'
      - '!macos/**'
      - '.github/requirements-lint.lock'
      - '.github/workflows/strata-python-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the pinned linter
        run: python -m pip install --only-binary :all: --require-hashes -r .github/requirements-lint.lock
      - name: Syntax errors and undefined names
        # setup.py still runs on Python 3.10 (setup.sh), so the syntax is checked for 3.10
        run: |
          git ls-files -z '*.py' ':(exclude)macos' |
            xargs -0 ruff check --isolated --target-version py310 --select E9,F63,F7,F82
