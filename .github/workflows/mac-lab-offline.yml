name: Mac lab offline checks

on:
  pull_request:
    branches: [mac-m5-lab]
    paths:
      - 'macos/lab/**'
      - 'FORK-NOTES.md'
      - '.github/workflows/mac-lab-offline.yml'
  # the merged result too: a pull request is checked at its own head, not as it lands
  push:
    branches: [mac-m5-lab]
    paths:
      - 'macos/lab/**'
      - 'FORK-NOTES.md'
      - '.github/workflows/mac-lab-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    # Fixture verification uses macOS F_NOCACHE; preserve the real platform API.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install pinned Python dependencies
        run: |
          python -m pip install --only-binary :all: --require-hashes -r macos/lab/requirements-ci.lock -r macos/lab/requirements-quality.lock
      - name: Restore pinned source dependencies only
        working-directory: macos/lab
        env:
          API_SHELL_REV: 2cc4153409edb3f859187bdf10f13e34972d6ffb
          LLAMA_REV: d81235049384534c167caea52b85a694f6103d14
        run: |
          mkdir -p vendor/Strata-macOS vendor/llama.cpp
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 "https://codeload.github.com/jinzy0623/Strata-macOS/tar.gz/$API_SHELL_REV" -o "$RUNNER_TEMP/api-shell.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' --retry 3 "https://codeload.github.com/ggml-org/llama.cpp/tar.gz/$LLAMA_REV" -o "$RUNNER_TEMP/llama.tar.gz"
          tar -xzf "$RUNNER_TEMP/api-shell.tar.gz" --strip-components=1 -C vendor/Strata-macOS
          tar -xzf "$RUNNER_TEMP/llama.tar.gz" --strip-components=1 -C vendor/llama.cpp
      - name: Run load-free inventory
        working-directory: macos/lab
        run: |
          export MAC_QUALITY_COVERAGE_SCOPE="$(python scripts/check_coverage.py --scope)"
          export MAC_QUALITY_COVERAGE_CONTEXT="$(python scripts/check_coverage.py --context)"
          python -m coverage run --rcfile=config/coverage.ini scripts/validate_offline.py
      - name: Check benchmark termination with tiny owned fixtures
        working-directory: macos/lab
        run: python -m unittest discover -s tests -p test_benchmark_termination.py -v
      - name: Check launcher termination with tiny owned fixtures
        working-directory: macos/lab
        run: python -m unittest discover -s tests -p test_run_termination.py -v
      - name: Check profile verifier termination with tiny owned fixtures
        working-directory: macos/lab
        run: python -m unittest discover -s tests -p test_profile_verifier_termination.py -v
      - name: Check local port restart and ownership
        working-directory: macos/lab
        run: python -m unittest discover -s tests -p test_runtime_ports.py -v
      - name: Check guarded local HTTP intake with the mock engine
        working-directory: macos/lab
        run: python -m unittest discover -s tests -p test_web_intake_sockets.py -v
      - name: Check browser status transitions
        run: |
          node --check macos/lab/web/mac.js
          node --check macos/lab/web/ui-state.js
          node --check macos/lab/web/performance.js
          node --test macos/lab/tests/*.test.cjs
      - name: Check maintained Mac lint, formatting, types and size
        working-directory: macos/lab
        run: python scripts/check_quality.py
      - name: Check focused Mac line and branch coverage
        working-directory: macos/lab
        run: python scripts/check_coverage.py
      - name: Install pinned browser lint tools
        working-directory: macos/lab
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint maintained browser scripts
        working-directory: macos/lab
        run: npm run lint
      - name: Retain offline receipt and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-lab-offline-receipt
          path: |
            macos/lab/bench/features/offline-validation.json
            macos/lab/bench/features/offline-validation.log
            macos/lab/bench/features/code-quality/latest-sizes.json
            macos/lab/bench/features/coverage/coverage.json
            macos/lab/bench/features/coverage/gate.json
          if-no-files-found: error
